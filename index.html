<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#ec4899" />
  <title>내친구 포밍뿌</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="assets/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="포밍뿌" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- SELECT -->
  <div id="select-screen" class="screen">
    <h1>내친구 포밍뿌</h1>
    <p class="subtitle">키울 친구를 골라주세요 ♥</p>
    <div class="char-grid">
      <div class="char-card porongi" data-char="porongi">
        <img src="assets/characters/porongi.png" alt="포롱이" />
        <div class="char-info">
          <h3>포롱이</h3>
          <p>꽃나라에서 온 상냥한 친구</p>
          <span class="tag">꽃 · 토끼</span>
        </div>
      </div>
      <div class="char-card mingttu" data-char="mingttu">
        <img src="assets/characters/mingttu.png" alt="밍뚜" />
        <div class="char-info">
          <h3>밍뚜</h3>
          <p>젤리나라의 개구쟁이</p>
          <span class="tag">젤리 · 활발</span>
        </div>
      </div>
      <div class="char-card pubi" data-char="pubi">
        <img src="assets/characters/pubi.png" alt="뿌비" />
        <div class="char-info">
          <h3>뿌비</h3>
          <p>거북나라의 귀여운 막내</p>
          <span class="tag">거북 · 애교</span>
        </div>
      </div>
    </div>
    <button class="start-btn" id="start-btn">이 친구와 시작하기!</button>
    <div class="reset-area">
      <button class="reset-btn" id="reset-btn">데이터 초기화</button>
    </div>
  </div>

  <!-- HOME -->
  <div id="home-screen" class="screen">
    <div class="top-bar">
      <div class="care-badge">💖 케어 <span id="care-points">0</span></div>
      <div class="coin-box">🪙 <span id="coins">50</span></div>
    </div>

    <div class="stats-card">
      <div class="stat-row hunger">
        <span class="stat-icon">🍚</span>
        <span class="stat-label">포만감</span>
        <div class="stat-bar"><div class="stat-fill" id="hunger-bar" style="width:80%"></div></div>
        <span class="stat-val" id="hunger-val">80</span>
      </div>
      <div class="stat-row clean">
        <span class="stat-icon">🫧</span>
        <span class="stat-label">청결</span>
        <div class="stat-bar"><div class="stat-fill" id="clean-bar" style="width:80%"></div></div>
        <span class="stat-val" id="clean-val">80</span>
      </div>
      <div class="stat-row love">
        <span class="stat-icon">💗</span>
        <span class="stat-label">애정</span>
        <div class="stat-bar"><div class="stat-fill" id="love-bar" style="width:80%"></div></div>
        <span class="stat-val" id="love-val">80</span>
      </div>
    </div>

    <div class="room">
      <div class="room-wall"></div>
      <div class="room-floor"></div>
      <div class="window"></div>
      <div class="pet-name-tag" id="pet-name">포롱이</div>
      <div class="speech" id="speech"></div>
      <img class="pet" id="pet-img" src="assets/characters/porongi.png" alt="pet" />
    </div>

    <div class="actions">
      <button class="action-btn" data-action="feed"><span class="emoji">🍚</span>밥주기<span class="sub"></span></button>
      <button class="action-btn" data-action="snack"><span class="emoji">🍭</span>간식<span class="sub"></span></button>
      <button class="action-btn" data-action="bath"><span class="emoji">🛁</span>목욕<span class="sub"></span></button>
      <button class="action-btn" data-action="brush"><span class="emoji">🪥</span>양치<span class="sub"></span></button>
      <button class="action-btn" data-action="play"><span class="emoji">🎾</span>놀아주기<span class="sub"></span></button>
      <button class="action-btn" data-action="pet"><span class="emoji">🤗</span>쓰다듬기<span class="sub"></span></button>
    </div>

    <div class="m0-note">M0 뼈대 — 성장·상점·미니게임·소풍은 다음 마일스톤에서</div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="js/engine.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
